services:
  api:
    build: ./api
    container_name: deepsafe-api
    ports:
      - "${PORT:-8003}:8000"
    restart: unless-stopped
    volumes:
      - ./api/meta_model_artifacts:/app/meta_model_artifacts:ro
      - ./config/deepsafe_config.json:/app/config/deepsafe_config.json:ro
    environment:
      - PORT=8000
      - META_MODEL_ARTIFACTS_DIR=/app/meta_model_artifacts
      - DEEPSAFE_CONFIG_FILE_PATH=/app/config/deepsafe_config.json
      # - LOG_LEVEL=debug # Optional: for more verbose API logs
    depends_on:
      - npr_deepfakedetection
      - yermandy_clip_detection
      - wavelet_clip_detection
      - universalfakedetect
      - video-detect
      - vocoder_artifacts
      - spsl_deepfake_detection
      - ucf_deepfake_detection
    networks:
      - deepsafe-network

  # --- Image Model Services ---
  npr_deepfakedetection:
    build: ./models/image/npr_deepfakedetection
    container_name: deepsafe-npr_deepfakedetection
    ports:
      - "${NPR_PORT:-5001}:5001"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5001
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=${MODEL_TIMEOUT:-600}
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  yermandy_clip_detection:
    build: ./models/image/yermandy_clip_detection
    container_name: deepsafe-yermandy-clip-detection
    ports:
      - "${YERMANDY_PORT:-5002}:5002"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5002
      - MODEL_PATH=model_code/weights/model.ckpt
      - PRELOAD_MODEL=true
      - MODEL_TIMEOUT=600
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  wavelet_clip_detection:
    build: ./models/image/wavelet_clip_detection
    container_name: deepsafe-wavelet-clip-detection
    ports:
      - "${WAVELET_PORT:-5003}:5003"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5003
      - MODEL_PATH=model_code/weights/clip_wavelet_best.pth
      - PRELOAD_MODEL=true
      - MODEL_TIMEOUT=600
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  # trufor (disabled: CPU-only, 77s per prediction — weights download also failing)
  # trufor:
  #   build: ./models/image/trufor
  #   container_name: deepsafe-trufor
  #   ports:
  #     - "5005:5005"
  #   restart: unless-stopped
  #   environment:
  #     - MODEL_PORT=5005
  #     - PRELOAD_MODEL=false
  #     - MODEL_TIMEOUT=600
  #     - USE_GPU=${USE_GPU:-true}
  #   networks:
  #     - deepsafe-network
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [ gpu ]

  universalfakedetect:
    build: ./models/image/universalfakedetect
    container_name: deepsafe-universalfakedetect
    ports:
      - "${UNIVERSAL_PORT:-5004}:5004"
    restart: unless-stopped
    environment:
      - MODEL_PORT=5004
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=${MODEL_TIMEOUT:-600}
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  spsl_deepfake_detection:
    build: ./models/image/spsl_deepfake_detection
    container_name: deepsafe-spsl-deepfake-detection
    ports:
      - "${SPSL_PORT:-5006}:5006"
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      - MODEL_PORT=5006
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  ucf_deepfake_detection:
    build: ./models/image/ucf_deepfake_detection
    container_name: deepsafe-ucf-deepfake-detection
    ports:
      - "${UCF_PORT:-5007}:5007"
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    environment:
      - MODEL_PORT=5007
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=600
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  video-detect:
    build: ./models/video/cross_efficient_vit
    ports:
      - "${VIDEO_PORT:-7001}:7001"
    restart: unless-stopped
    environment:
      - MODEL_PORT=7001
      - PRELOAD_MODEL=false
      - MODEL_TIMEOUT=900
      - USE_GPU=${USE_GPU:-true}
    networks:
      - deepsafe-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    # Optional: Add resource limits for CPU/memory if this model is resource-intensive
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0' 
    #       memory: 4G

    # --- Audio Model Services ---
  vocoder_artifacts:
    build: ./models/audio/vocoder_artifacts
    container_name: deepsafe-vocoder-artifacts
    ports:
      - "${AUDIO_PORT:-7002}:7002"
    restart: unless-stopped
    environment:
      - MODEL_PORT=7002
      - PRELOAD_MODEL=true
      - USE_GPU=${USE_GPU:-true}
    volumes:
      - ./models/audio/vocoder_artifacts/models:/app/models
    networks:
      - deepsafe-network
  frontend:
    build: ./frontend
    container_name: deepsafe-frontend
    ports:
      - "8888:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - deepsafe-network

networks:
  deepsafe-network:
    driver: bridge
